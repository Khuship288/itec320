<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cafe Menu</title>
    <link href="menu.css" rel="stylesheet">
</head>
<body>
    <h1>The Golden Spoon Cafe</h1>
    <p class="subtitle"> Open daily 8Am-10PM</p>
    <hr>
    <div class="menu-section"> 
        <div class="button">Popular</div>
        <h2>Appetizers</h2>
        <ul>
            <li><span class="item">Bruschetta</span> <span class="price">$8.99</span></li>
            <li><span class="item">Soup of the day</span> <span class="price">$6.50</span></li>
            <li><span class="item">Garden salad</span> <span class="price">$7.25</span></li>
        </ul>
    </div>

    <div class="menu-section"> 
        <h2>Entrees</h2>
        <ul>
            <li><span class="item">Grilled salmon</span> <span class="price">$18.99</span></li>
            <li><span class="item">Pasta primavera</span> <span class="price">$14.50</span></li>
            <li><span class="item"> BBQ Chicken</span> <span class="price">$16.00</span></li>
        </ul>
    </div>
    <hr>
    <a href="https://example.com" class="order-btn"> Order Online</a>

</body>
</html>
